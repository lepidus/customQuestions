variables:
    PLUGIN_NAME: 'customQuestions'

include:
  - project: 'documentacao-e-tarefas/modelosparaintegracaocontinua'
    ref: stable-3_5_0
    file:
      - 'templates/groups/pkp_plugin.yml'
      - 'templates/groups/ojs/unit_tests.yml'
      - 'templates/groups/ops/unit_tests.yml'
      - 'templates/groups/ojs/cypress_tests.yml'
      - 'templates/groups/ops/cypress_tests.yml'

# Run the plugin integration suites below, but leave the full application
# integration suites to the OJS and OPS application pipelines.
ojs_integration_tests:
  rules:
    - when: never

ops_integration_tests:
  rules:
    - when: never

.custom_questions_schema_database:
  - |
    CUSTOM_QUESTIONS_SCHEMA_TEST_CONFIG="$(php "$CI_PROJECT_DIR/tests/prepareSchemaTestDatabase.php")"
    export CUSTOM_QUESTIONS_SCHEMA_TEST_CONFIG

plugin_unit_tests_ojs:
  before_script:
    - !reference [.custom_questions_schema_database]

plugin_unit_tests_ops:
  before_script:
    - !reference [.custom_questions_schema_database]
