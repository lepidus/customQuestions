on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

name: Create release and tar.gz package for it

jobs:
  create-release:
    name: Create release and package
    env:
      PLUGIN_NAME: customQuestions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check version.xml
        run: |
          sudo apt-get update
          sudo apt-get install --yes xmlstarlet

          application="$(xmlstarlet sel -t -v 'version/application' version.xml)"
          if [[ "$application" != "$PLUGIN_NAME" ]]; then
            echo "::error::version.xml application '$application' does not match '$PLUGIN_NAME'"
            exit 1
          fi

          release="$(xmlstarlet sel -t -v 'version/release' version.xml)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$release" != "$tag" ]]; then
            echo "::error::version.xml release '$release' does not match tag '$tag'"
            exit 1
          fi

          release_date="$(xmlstarlet sel -t -v 'version/date' version.xml)"
          if [[ ! "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::version.xml date '$release_date' is not a valid release date"
            exit 1
          fi
          if [[ "$(date --date="$release_date" +'%Y-%m-%d' 2> /dev/null)" != "$release_date" ]]; then
            echo "::error::version.xml date '$release_date' is not a valid calendar date"
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            current_date="$(date +'%Y-%m-%d')"
            if [[ "$release_date" != "$current_date" ]]; then
              echo "::error::version.xml date '$release_date' does not match '$current_date'"
              exit 1
            fi
          fi
        shell: bash
      - name: Create the tar.gz package
        run: |
          mkdir "$PLUGIN_NAME"
          shopt -s extglob
          cp -r !(${PLUGIN_NAME}|.git*|.|..|tests|cypress) ${PLUGIN_NAME}
          tar -zcvf "$PLUGIN_NAME.tar.gz" "$PLUGIN_NAME"
        shell: bash
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$PLUGIN_NAME.tar.gz" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$PLUGIN_NAME.tar.gz" \
              --verify-tag \
              --title "Release $GITHUB_REF_NAME" \
              --notes ""
          fi
        shell: bash
